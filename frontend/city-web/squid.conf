# Fairfield webproxy (Squid): the ONLY route from the Fairfield AI Assistant to the internet.
# Allows HTTPS (CONNECT :443) to exactly two public City sites and nothing else.
# Clients: only the `city-web` MCP server (the proxy sits on the private `webtools` network).

http_port 3128

acl approved_sites dstdomain www.fairfield.ca.gov pub-fairfield.escribemeetings.com
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !approved_sites
http_access deny !CONNECT
http_access deny !https_port
http_access allow CONNECT approved_sites https_port
http_access deny all

# Don't reveal internal addresses or the proxy to the sites.
forwarded_for delete
via off

# No caching of City pages; this is a pass-through.
cache deny all

# Audit trail: one line per connection (time, client, result, bytes, host:port).
logformat fairfield %{%Y-%m-%dT%H:%M:%S%z}tl %>a %Ss/%03>Hs %<st %rm %ru
access_log stdio:/var/log/squid/access.log fairfield
cache_log stdio:/var/log/squid/cache.log
pid_filename /run/squid.pid
