# Fairfield AI Assistant - LibreChat compose override (DEV)
# Tracked at ~/fairfield-assistant/frontend/; LibreChat/docker-compose.override.yml is a symlink to it.
# Relative paths resolve against the LibreChat/ project directory.
# Docs: https://www.librechat.ai/docs/configuration/docker_override
#
# AIR-GAPPED (CJIS: no City data leaves the City). Every service sits on the
# compose "default" network, which is `internal: true` and so has no route
# off the Docker host. The one exception is the `gateway` container. It
# also joins `egress`, and it runs only fixed socat forwards:
#   ingress: Mac 127.0.0.1:3080/3000/4000 -> api / admin-panel / litellm
#   egress : gateway:8000/8001 -> 192.168.250.1:8000/8001 (the Spark over the direct cable, nothing else)
#
# APPROVED EXCEPTION (user, 2026-10-01): read-only access to two public City
# sites, www.fairfield.ca.gov and pub-fairfield.escribemeetings.com.
#   api -> city-web (MCP tool; allowlist, GET-only, audit log) -> webproxy (Squid;
#   CONNECT :443 to those two hosts only, access log) -> internet.
# `webproxy` is the only other service on `egress`. It sits on its own
# internal `webtools` network that only `city-web` shares, so nothing else can
# reach it.
# Audit logs: LibreChat/logs/city-web/audit.jsonl, LibreChat/logs/webproxy/access.log

networks:
  default:
    internal: true
  webtools:
    internal: true
  egress: {}

services:
  gateway:
    container_name: gateway
    # alpine/socat:1.8.1.3 = alpine/socat@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
    # (pulled on the Spark, moved to the Mac with docker save/load; see CHANGELOG).
    image: alpine/socat:1.8.1.3
    pull_policy: never
    restart: always
    networks: [default, egress]
    ports:
      - "127.0.0.1:${PORT:-3080}:3080"
      - "127.0.0.1:${ADMIN_PANEL_PORT:-3000}:3000"
      - "127.0.0.1:4000:4000"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        socat TCP-LISTEN:3080,fork,reuseaddr TCP:api:${PORT:-3080} &
        socat TCP-LISTEN:3000,fork,reuseaddr TCP:admin-panel:3000 &
        socat TCP-LISTEN:4000,fork,reuseaddr TCP:litellm:4000 &
        socat TCP-LISTEN:8000,fork,reuseaddr TCP:192.168.250.1:8000 &
        exec socat TCP-LISTEN:8001,fork,reuseaddr TCP:192.168.250.1:8001

  api:
    # Pin the v0.8.8 release image (the base file defaults to librechat-dev:latest).
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    # Not published; reached through the gateway (127.0.0.1:3080 on the Mac).
    ports: !reset []
    depends_on:
      - litellm
      - city-web
    volumes:
      - type: bind
        source: ../frontend/librechat.yaml
        target: /app/librechat.yaml
        read_only: true
      # City of Fairfield branding: replace the stock LibreChat logo, favicons
      # and PWA manifest (none of these have precompressed .gz/.br siblings).
      - { type: bind, read_only: true, source: ../frontend/branding/logo.svg, target: /app/client/dist/assets/logo.svg }
      - { type: bind, read_only: true, source: ../frontend/branding/favicon-16x16.png, target: /app/client/dist/assets/favicon-16x16.png }
      - { type: bind, read_only: true, source: ../frontend/branding/favicon-32x32.png, target: /app/client/dist/assets/favicon-32x32.png }
      - { type: bind, read_only: true, source: ../frontend/branding/apple-touch-icon-180x180.png, target: /app/client/dist/assets/apple-touch-icon-180x180.png }
      - { type: bind, read_only: true, source: ../frontend/branding/icon-192x192.png, target: /app/client/dist/assets/icon-192x192.png }
      - { type: bind, read_only: true, source: ../frontend/branding/maskable-icon.png, target: /app/client/dist/assets/maskable-icon.png }
      - { type: bind, read_only: true, source: ../frontend/branding/manifest.webmanifest, target: /app/client/dist/manifest.webmanifest }
      - { type: bind, read_only: true, source: ../frontend/branding/fairfield-theme.css, target: /app/client/dist/assets/fairfield-theme.css }
    # Same as the image's CMD (`npm run backend`), but first patch the shell
    # index.html: link the Fairfield colour theme after the bundled CSS, and set
    # the pre-JS <title> and theme-color. The server reads index.html once at
    # startup and serves it from memory (the stale index.html.gz/.br are never
    # served). Assets are cached for 2 days, so the link carries a checksum of the
    # CSS (`?v=`); any old link is stripped first so restarts don't patch twice.
    command:
      - sh
      - -c
      - >-
        v=$$(cksum < client/dist/assets/fairfield-theme.css | cut -d' ' -f1) &&
        sed -i
        -e 's#<link rel="stylesheet" href="./assets/fairfield-theme.css[^>]*>##'
        -e "s#</head>#<link rel=\"stylesheet\" href=\"./assets/fairfield-theme.css?v=$$v\"></head>#"
        -e 's#<title>LibreChat</title>#<title>Fairfield AI Assistant</title>#'
        -e 's#name="theme-color" content="[^"]*"#name="theme-color" content="\#365f9f"#'
        client/dist/index.html;
        exec npm run backend

  admin-panel:
    # Pinned (the base file uses :latest). Reached through the gateway (127.0.0.1:3000).
    image: registry.librechat.ai/clickhouse/librechat-admin-panel@sha256:a395465d1daa3c11495810a8c224df86675985d50de42e98e36eeedbd8aecb94
    ports: !reset []

  rag_api:
    # Pinned (the base file uses :latest). Embeddings come from the local
    # `ollama` service (EMBEDDINGS_PROVIDER=ollama in LibreChat/.env), not OpenAI.
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite@sha256:a62ce2221b43a9bb57fa6cb733e7047c80132960272c33d5704028f3071a1251
    depends_on:
      - vectordb
      - ollama

  ollama:
    container_name: ollama
    # ollama/ollama:0.35.0 = ollama/ollama@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    # (pulled on the Spark, moved with docker save/load). CPU only; serves the
    # nomic-embed-text embedding model for rag_api. Model files were copied in
    # from the Spark (no pulls from here: no internet route).
    image: ollama/ollama:0.35.0
    pull_policy: never
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NO_CLOUD=1 # no remote inference, web search or ollama.com lookups
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ./ollama_data:/root/.ollama

  city-web:
    container_name: city-web
    # Built from frontend/city-web/ on the Spark, moved with docker save/load
    # (see CHANGELOG). MCP server (streamable HTTP, :8000/mcp) used by the
    # Fairfield Assistant model spec.
    image: fairfield/city-web:1.0
    pull_policy: never
    restart: always
    networks: [default, webtools]
    depends_on:
      - webproxy
    environment:
      - HTTPS_PROXY=http://webproxy:3128
      - NO_PROXY=
    volumes:
      - ./logs/city-web:/logs

  webproxy:
    container_name: webproxy
    # ubuntu/squid:6.13-24.04 = ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    # (pulled on the Spark, moved with docker save/load).
    image: ubuntu/squid:6.13-24.04
    pull_policy: never
    restart: always
    networks: [webtools, egress]
    volumes:
      - type: bind
        source: ../frontend/city-web/squid.conf
        target: /etc/squid/squid.conf
        read_only: true
      - ./logs/webproxy:/var/log/squid

  litellm:
    container_name: litellm
    # v1.103.2 (same digest as main-stable on 2026-10-01); multi-arch incl. linux/arm64.
    image: ghcr.io/berriai/litellm:v1.103.2@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
    restart: always
    command: ["--config", "/app/config.yaml", "--port", "4000", "--telemetry", "False"]
    # Not published; reached through the gateway (127.0.0.1:4000). Calls the Spark via gateway:8000/8001.
    depends_on:
      - gateway
    env_file:
      - ../.env # VLLM_API_KEY (project secrets file, gitignored)
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # Use the bundled model price map instead of fetching it from raw.githubusercontent.com at startup.
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    volumes:
      - type: bind
        source: ../frontend/litellm-config.yaml
        target: /app/config.yaml
        read_only: true
